<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gabriel Edé — Nada no deserto</title>
  <meta name="description" content="Nada no deserto — álbum de Gabriel Edé, lançado em 2026. Ouça em todas as plataformas.">

  <meta property="og:title" content="Gabriel Edé — Nada no deserto">
  <meta property="og:description" content="Ouça Nada no deserto em sua plataforma preferida.">
  <meta property="og:type" content="music.album">
  <meta property="og:url" content="https://gabrielede.com/album/nadanodeserto/">
  <meta property="og:image" content="https://gabrielede.com/album/nadanodeserto/nada-no-deserto.jpg">

  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/jpeg" href="nada-no-deserto.jpg">
  <link rel="apple-touch-icon" href="nada-no-deserto.jpg">

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap");

    :root {
      --text: #f3f3f3;
      --muted: rgba(255,255,255,.64);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #050505;
    }

    body {
      color: var(--text);
      font-family: "Space Grotesk", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* The album artwork is also the full-page blurred background. */
    .background {
      position: fixed;
      inset: -50px;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(0,0,0,.50), rgba(0,0,0,.62)),
        url("nada-no-deserto.jpg") center / cover no-repeat;
      filter: blur(32px);
      transform: scale(1.08);
      opacity: .78;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 55px 16px 55px;
    }

    .card {
      width: min(100%, 430px);
      margin: 0 auto;
    }

    /* The cover is the first card itself. */
    .cover-link {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 16px;
      overflow: hidden;
      background: transparent;
      color: inherit;
      cursor: pointer;
      box-shadow:
        0 34px 80px rgba(0,0,0,.60),
        0 10px 26px rgba(0,0,0,.30);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 16px;
      transition: transform .30s ease, filter .30s ease;
    }

    .cover-link:hover .cover {
      transform: scale(1.012);
      filter: brightness(.82);
    }

    .cover-play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.94);
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 5px;
      background: rgba(0,0,0,.52);
      color: rgba(255,255,255,.94);
      font-size: 12px;
      line-height: 1;
      opacity: 0;
      transition: opacity .22s ease, transform .22s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .cover-link:hover .cover-play,
    .cover-link:focus-visible .cover-play {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .cover-link:focus-visible {
      outline: 1px solid rgba(255,255,255,.55);
      outline-offset: 3px;
    }

    @media (hover: none) {
      .cover-play {
        opacity: .88;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* YouTube player replaces the cover but keeps the exact same 1:1 footprint. */
    .video-wrap {
      position: relative;
      display: none;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow:
        0 34px 80px rgba(0,0,0,.60),
        0 10px 26px rgba(0,0,0,.30);
    }

    .video-wrap.active {
      display: block;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      background: rgba(0,0,0,.60);
      color: white;
      font: 22px/1 Arial, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .video-close:hover {
      background: rgba(0,0,0,.82);
    }

    .year {
      margin: 20px 0 21px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .14em;
      text-align: center;
    }

    /* Second card: the streaming destinations. */
    .stream-box {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(12,12,12,.58);
      box-shadow:
        0 30px 75px rgba(0,0,0,.52),
        0 8px 24px rgba(0,0,0,.20);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .listen-label {
      padding: 19px 18px 13px;
      color: rgba(255,255,255,.68);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
      text-align: center;
    }

    .links {
      padding: 0 14px 13px;
      display: flex;
      flex-direction: column;
    }

    .link {
      min-height: 58px;
      padding: 10px 2px 10px 6px;
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--text);
      text-decoration: none;
      background: transparent;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .link + .link {
      border-top: 1px solid rgba(255,255,255,.095);
    }

    .link:hover {
      background: transparent;
    }

    .link:focus-visible {
      outline: 1px solid rgba(255,255,255,.42);
      outline-offset: -1px;
    }

    .provider {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .provider-logo {
      width: 25px;
      height: 25px;
      object-fit: contain;
      flex: 0 0 25px;
    }

    .qobuz-logo {
      width: 52px;
      height: 22px;
      flex: 0 0 52px;
      object-fit: contain;
    }

    .provider-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .play {
      flex: 0 0 auto;
      min-width: 45px;
      height: 27px;
      padding: 0 7px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 4px;
      color: rgba(255,255,255,.78);
      background: rgba(0,0,0,.10);
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .play::before {
      content: "▶";
      font-size: 8px;
      line-height: 1;
    }

    .link:hover .play {
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.50);
    }

    .social {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 19px;
      opacity: .72;
    }

    .social a {
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: .78;
    }

    .social a:hover {
      opacity: 1;
    }

    .social img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 11px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 699px) {
      main {
        padding-top: 30px;
        padding-bottom: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>

  <main>
    <section class="card">

      <button class="cover-link" type="button"
              aria-label="Reproduzir o álbum completo no YouTube"
              onclick="openVideo()">
        <img class="cover"
             src="nada-no-deserto.jpg"
             alt="Capa do álbum Nada no deserto, de Gabriel Edé">
        <span class="cover-play" aria-hidden="true">▶ PLAY</span>
      </button>

      <div class="video-wrap" id="video-player" aria-hidden="true">
        <button class="video-close" type="button"
                onclick="closeVideo()"
                aria-label="Fechar vídeo">×</button>

        <iframe
          id="youtube-frame"
          src=""
          title="Gabriel Edé — Nada no deserto (full album)"
          frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div class="year">2026</div>

      <section class="stream-box" aria-label="Ouça o álbum">
        <div class="listen-label">OUÇA</div>

        <nav class="links">
<a class="link" href="https://open.spotify.com/album/3wDtST99sopMASEpENu8T4" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://cdn.simpleicons.org/spotify/1DB954" alt="">
            <span class="provider-name">Spotify</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://music.youtube.com/playlist?list=OLAK5uy_kj93mymQLg1gYnmP2LugGfX" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://cdn.simpleicons.org/youtubemusic/FF0000" alt="">
            <span class="provider-name">YouTube Music</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://tidal.com/album/521587882/u" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://cdn.simpleicons.org/tidal/FFFFFF" alt="">
            <span class="provider-name">TIDAL</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://gabrieleden.bandcamp.com/album/nada-no-deserto" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://cdn.simpleicons.org/bandcamp/1DA0C3" alt="">
            <span class="provider-name">Bandcamp</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://www.qobuz.com/us-en/album/nada-no-deserto-gabriel-ede/v2poOlvokyn7y" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo qobuz-logo" src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Qobuz_logo_light.svg" alt="">
            <span class="provider-name">Qobuz</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://www.deezer.com/album/976477571" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://cdn.simpleicons.org/deezer/A238FF" alt="">
            <span class="provider-name">Deezer</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://www.pandora.com/AL:66162901" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://cdn.simpleicons.org/pandora/00A0EE" alt="">
            <span class="provider-name">Pandora</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://music.apple.com/us/album/nada-no-deserto/1766339142" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://api.iconify.design/simple-icons:applemusic.svg?color=%23FA243C" alt="">
            <span class="provider-name">Apple Music</span>
          </span>
          <span class="play">PLAY</span>
        </a>

<a class="link" href="https://www.amazon.com/music/player/albums/B0GZJCN312" target="_blank" rel="noopener">
          <span class="provider">
            <img class="provider-logo" src="https://api.iconify.design/simple-icons:amazonmusic.svg?color=%2346C3D0" alt="">
            <span class="provider-name">Amazon Music</span>
          </span>
          <span class="play">PLAY</span>
        </a>
        </nav>
      </section>

      

      <footer>
        <a href="https://gabrielede.com/">gabrielede.com</a>
      </footer>

    </section>
  </main>

  <script>
    const YOUTUBE_ID = "QBdcH1-SA9A";

    function openVideo() {
      const cover = document.querySelector(".cover-link");
      const player = document.getElementById("video-player");
      const frame = document.getElementById("youtube-frame");

      /*
       * controls=0 removes YouTube's large control bar and title overlay.
       * rel=0 prevents the old "related videos from other channels" behavior.
       * modestbranding is retained for compatibility, although YouTube now
       * controls branding itself.
       *
       * The video remains embedded in the same square area as the cover.
       */
      frame.src =
        "https://www.youtube-nocookie.com/embed/" + YOUTUBE_ID +
        "?autoplay=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3";

      cover.style.display = "none";
      player.classList.add("active");
      player.setAttribute("aria-hidden", "false");
    }

    function closeVideo() {
      const cover = document.querySelector(".cover-link");
      const player = document.getElementById("video-player");
      const frame = document.getElementById("youtube-frame");

      frame.src = "";
      player.classList.remove("active");
      player.setAttribute("aria-hidden", "true");
      cover.style.display = "block";
    }
  </script>
</body>
</html>
