<head>

  <!-- Preview when sharing the page -->
  <meta property="og:title" content="Gabriel Edé — Nada no deserto">
  <meta property="og:description" content="Ouça Nada no deserto em sua plataforma preferida.">
  <meta property="og:type" content="music.album">

  <link rel="icon" type="image/jpeg" href="nada-no-deserto.jpg">
  <link rel="apple-touch-icon" href="nada-no-deserto.jpg">


  <style>
    :root {
      --bg: #080808;
      --panel: rgba(20,20,20,.94);
      --text: #f3f3f3;
      --muted: #a5a5a5;
      --border: rgba(255,255,255,.22);
      --hover: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -8%;
      z-index: -2;
      background:
        linear-gradient(rgba(0,0,0,.34), rgba(0,0,0,.55)),
        url("nada-no-deserto.jpg") center / cover no-repeat;
      filter: blur(28px);
      transform: scale(1.08);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0,0,0,.38);
      pointer-events: none;
    }

    main {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 30px 16px 38px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px 12px 18px;
      box-shadow: 0 22px 70px rgba(0,0,0,.48);
      backdrop-filter: blur(10px);
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }

    header {
      text-align: center;
      padding: 17px 8px 13px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link {
      min-height: 57px;
      padding: 9px 9px 9px 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255,255,255,.018);
      transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
    }

    .link:hover {
      background: var(--hover);
      border-color: rgba(255,255,255,.42);
      transform: translateY(-1px);
    }

    .provider {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .provider-logo {
      width: 25px;
      height: 25px;
      object-fit: contain;
      flex: 0 0 25px;
    }

    .provider-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .play {
      flex: 0 0 auto;
      min-width: 42px;
      height: 25px;
      padding: 0 8px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 4px;
      color: #e7e7e7;
      background: rgba(0,0,0,.20);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .play::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid currentColor;
    }

    .social {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      padding: 17px 0 1px;
    }

    .social a {
      width: 27px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: .78;
      transition: opacity .16s ease, transform .16s ease;
    }

    .social a:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .social img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 11px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (min-width: 700px) {
      main {
        padding-top: 55px;
        padding-bottom: 55px;
      }

      .card {
        padding: 14px 14px 20px;
      }
    }
  
    .provider-logo.qobuz-logo {
      width: 52px;
      height: 22px;
      object-fit: contain;
      filter: brightness(0) saturate(100%) invert(38%) sepia(99%) saturate(2400%) hue-rotate(198deg) brightness(96%) contrast(103%);
    }

  </style>
</head>
