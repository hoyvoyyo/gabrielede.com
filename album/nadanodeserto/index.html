  <style>
    :root {
      --bg: #111111;
      --text: #f2f2f2;
      --muted: #a9a9a9;
      --border: rgba(255,255,255,.20);
      --hover: rgba(255,255,255,.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 620px);
      padding: 44px 24px 56px;
      text-align: center;
    }

    .cover {
      width: min(78vw, 390px);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      margin: 0 auto 30px;
      border-radius: 2px;
      box-shadow: 0 18px 50px rgba(0,0,0,.42);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .artist {
      margin-top: 10px;
      font-size: 18px;
      color: var(--muted);
    }

    .year {
      margin-top: 5px;
      font-size: 14px;
      color: #777;
    }

    .links {
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      min-height: 56px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 16px;
      font-weight: 500;
      transition:
        background-color .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    .link:hover {
      background: var(--hover);
      border-color: rgba(255,255,255,.42);
      transform: translateY(-1px);
    }

    .link:active {
      transform: translateY(0);
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }


    .social {
      margin-top: 34px;
      padding-top: 26px;
      border-top: 1px solid rgba(255,255,255,.12);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .social a {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #999;
      text-decoration: none;
      transition: color .18s ease, transform .18s ease;
    }

    .social a:hover {
      color: #f2f2f2;
      transform: translateY(-1px);
    }

    .social svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    footer {
      margin-top: 42px;
      font-size: 13px;
      color: #666;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--muted);
    }

    @media (max-width: 480px) {
      main {
        padding: 28px 18px 44px;
      }

      .cover {
        width: min(84vw, 360px);
        margin-bottom: 26px;
      }

      .links {
        margin-top: 28px;
      }

      .link {
        min-height: 54px;
      }
    }
  </style>
